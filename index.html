<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI PPT 生成器 (DeepSeek)</title>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0f172a; color: #e2e8f0; margin: 0; padding: 24px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
  .panel {
    background: #1e293b; border: 1px solid #334155; border-radius: 12px;
    padding: 18px; margin-bottom: 18px;
  }
  label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; }
  input, textarea, select {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #475569; background: #0f172a; color: #e2e8f0;
    font-size: 14px; outline: none; font-family: inherit;
  }
  input:focus, textarea:focus { border-color: #6366f1; }
  textarea { resize: vertical; min-height: 70px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 180px; }
  button {
    background: #6366f1; color: #fff; border: none; padding: 11px 22px;
    border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600;
    transition: .15s;
  }
  button:hover { background: #4f46e5; }
  button:disabled { background: #475569; cursor: not-allowed; }
  button.ghost { background: #334155; }
  button.ghost:hover { background: #475569; }
  .btns { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  #status { font-size: 13px; color: #94a3b8; margin-top: 10px; min-height: 18px; }
  #status.err { color: #f87171; }
  #status.ok { color: #4ade80; }
  .slides { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 14px; }
  .slide {
    background: #fff; color: #1e293b; border-radius: 10px; padding: 16px;
    aspect-ratio: 16/9; overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 4px 14px rgba(0,0,0,.3);
  }
  .slide h3 { margin: 0 0 8px; font-size: 15px; color: #4f46e5; }
  .slide ul { margin: 0; padding-left: 16px; font-size: 11px; line-height: 1.5; }
  .slide li { margin-bottom: 3px; }
  .slide .notes { margin-top: auto; font-size: 10px; color: #64748b; font-style: italic; }
  .slide .cover { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center; }
  .slide .cover h2 { font-size: 20px; margin: 0 0 8px; color: #1e293b; }
  .slide .cover p { font-size: 12px; color: #64748b; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧠 AI PPT 生成器</h1>
  <div class="sub">填入 DeepSeek API Key → 输入主题 → 生成大纲与内容 → 导出 .pptx</div>

  <!-- 配置区 -->
  <div class="panel">
    <div class="row">
      <div style="flex:2">
        <label>DeepSeek API Key</label>
        <input id="apiKey" type="password" placeholder="sk-xxxxxxxxxxxxxxxx">
      </div>
      <div>
        <label>API 地址</label>
        <input id="apiBase" value="https://api.deepseek.com/chat/completions">
      </div>
      <div>
        <label>模型</label>
        <select id="model">
          <option value="deepseek-chat">deepseek-chat</option>
          <option value="deepseek-reasoner">deepseek-reasoner</option>
        </select>
      </div>
    </div>
    <div style="margin-top:12px">
      <label>演示主题 / 要求</label>
      <textarea id="topic" placeholder="例如：给初中生讲清楚什么是人工智能，10页左右，风格活泼"></textarea>
    </div>
    <div class="row" style="margin-top:12px">
      <div>
        <label>页数</label>
        <input id="pageCount" type="number" value="10" min="3" max="30">
      </div>
      <div>
        <label>语言</label>
        <select id="lang">
          <option value="中文">中文</option>
          <option value="English">English</option>
        </select>
      </div>
      <div>
        <label>主色调</label>
        <select id="theme">
          <option value="4F46E5">靛蓝</option>
          <option value="0EA5E9">天蓝</option>
          <option value="10B981">翠绿</option>
          <option value="F59E0B">琥珀</option>
          <option value="EF4444">朱红</option>
          <option value="8B5CF6">紫罗兰</option>
        </select>
      </div>
    </div>
    <div class="btns">
      <button id="genBtn">✨ 生成 PPT</button>
      <button id="exportBtn" class="ghost" disabled>⬇️ 导出 .pptx</button>
    </div>
    <div id="status"></div>
  </div>

  <!-- 预览区 -->
  <div class="panel">
    <div class="slides" id="slides"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const statusEl = $('status');

function setStatus(msg, type='') {
  statusEl.textContent = msg;
  statusEl.className = type;
}

// ---------- 调用 DeepSeek ----------
async function callDeepSeek(prompt) {
  const apiKey = $('apiKey').value.trim();
  const apiBase = $('apiBase').value.trim();
  const model = $('model').value;
  if (!apiKey) throw new Error('请先填写 DeepSeek API Key');

  const res = await fetch(apiBase, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`
    },
    body: JSON.stringify({
      model,
      messages: [
        { role: 'system', content: '你是一个专业的演示文稿策划师，只输出 JSON，不要输出任何解释性文字或 markdown 代码块标记。' },
        { role: 'user', content: prompt }
      ],
      temperature: 1.0,
      max_tokens: 4000
    })
  });

  if (!res.ok) {
    const t = await res.text();
    throw new Error(`API 请求失败 (${res.status}): ${t.slice(0, 300)}`);
  }
  const data = await res.json();
  return data.choices[0].message.content;
}

// 从可能带 ```json 包裹的文本中提取 JSON
function extractJSON(text) {
  let t = text.trim();
  t = t.replace(/^```(?:json)?/i, '').replace(/```$/i, '').trim();
  const start = t.indexOf('{');
  const end = t.lastIndexOf('}');
  if (start === -1 || end === -1) throw new Error('模型未返回有效 JSON');
  return JSON.parse(t.slice(start, end + 1));
}

// ---------- 生成 ----------
let deckData = null;

async function generate() {
  const topic = $('topic').value.trim();
  if (!topic) { setStatus('请先输入演示主题', 'err'); return; }
  const pages = $('pageCount').value;
  const lang = $('lang').value;
  const theme = $('theme').value;

  const prompt = `请为主题「${topic}」策划一份演示文稿。
要求：
1. 共 ${pages} 页左右（包含封面页和结尾页）。
2. 语言：${lang}。
3. 输出严格的 JSON，格式如下：
{
  "title": "演示文稿总标题",
  "subtitle": "副标题",
  "slides": [
    {
      "type": "cover",
      "title": "封面标题",
      "subtitle": "封面副标题"
    },
    {
      "type": "content",
      "title": "本页标题",
      "bullets": ["要点1", "要点2", "要点3"],
      "notes": "演讲备注（可选）"
    },
    {
      "type": "end",
      "title": "谢谢观看",
      "subtitle": "Q&A"
    }
  ]
}
4. bullets 每页 3-5 条，每条不超过 30 字，精炼有信息量。
5. 第一页 type 必须是 cover，最后一页 type 必须是 end，中间为 content。
6. 不要输出 JSON 以外的任何内容。`;

  $('genBtn').disabled = true;
  $('exportBtn').disabled = true;
  setStatus('正在调用 DeepSeek 生成内容…');

  try {
    const raw = await callDeepSeek(prompt);
    deckData = extractJSON(raw);
    if (!deckData.slides || !Array.isArray(deckData.slides)) {
      throw new Error('返回数据缺少 slides 数组');
    }
    render(deckData, theme);
    $('exportBtn').disabled = false;
    setStatus(`✅ 生成完成，共 ${deckData.slides.length} 页`, 'ok');
  } catch (e) {
    console.error(e);
    setStatus('❌ ' + e.message, 'err');
  } finally {
    $('genBtn').disabled = false;
  }
}

// ---------- 预览渲染 ----------
function render(deck, theme) {
  const box = $('slides');
  box.innerHTML = '';
  deck.slides.forEach(s => {
    const div = document.createElement('div');
    div.className = 'slide';

    if (s.type === 'cover') {
      div.innerHTML = `<div class="cover">
        <h2>${esc(s.title || deck.title)}</h2>
        <p>${esc(s.subtitle || deck.subtitle || '')}</p>
      </div>`;
    } else if (s.type === 'end') {
      div.innerHTML = `<div class="cover">
        <h2>${esc(s.title || '谢谢观看')}</h2>
        <p>${esc(s.subtitle || '')}</p>
      </div>`;
    } else {
      const bullets = (s.bullets || []).map(b => `<li>${esc(b)}</li>`).join('');
      div.innerHTML = `<h3>${esc(s.title)}</h3>
        <ul>${bullets}</ul>
        ${s.notes ? `<div class="notes">备注：${esc(s.notes)}</div>` : ''}`;
    }
    box.appendChild(div);
  });
}

function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ---------- 导出 PPTX ----------
async function exportPPTX() {
  if (!deckData) return;
  const theme = $('theme').value;
  const pptx = new PptxGenJS();
  pptx.layout = 'LAYOUT_16x9';

  deckData.slides.forEach(s => {
    const slide = pptx.addSlide();

    if (s.type === 'cover' || s.type === 'end') {
      slide.background = { color: theme };
      slide.addText(s.title || deckData.title || '', {
        x: 0.6, y: 1.6, w: 9, h: 1.2,
        fontSize: 36, bold: true, color: 'FFFFFF', align: 'center'
      });
      slide.addText(s.subtitle || deckData.subtitle || '', {
        x: 0.6, y: 2.9, w: 9, h: 0.8,
        fontSize: 18, color: 'E2E8F0', align: 'center'
      });
    } else {
      slide.background = { color: 'FFFFFF' };
      // 标题栏
      slide.addShape(pptx.ShapeType.rect, {
        x: 0, y: 0, w: '100%', h: 0.9, fill: { color: theme }
      });
      slide.addText(s.title || '', {
        x: 0.5, y: 0.12, w: 9, h: 0.66,
        fontSize: 22, bold: true, color: 'FFFFFF'
      });
      // 要点
      const bullets = (s.bullets || []).map(b => ({
        text: b, options: { bullet: { code: '25CF' }, breakLine: true }
      }));
      slide.addText(bullets, {
        x: 0.7, y: 1.3, w: 8.6, h: 3.6,
        fontSize: 16, color: '1E293B', lineSpacingMultiple: 1.4,
        valign: 'top'
      });
      // 备注
      if (s.notes) slide.addNotes(s.notes);
    }
  });

  await pptx.writeFile({ fileName: (deckData.title || 'AI-PPT') + '.pptx' });
  setStatus('✅ 已导出 .pptx', 'ok');
}

// ---------- 绑定 ----------
$('genBtn').onclick = generate;
$('exportBtn').onclick = exportPPTX;

// 本地缓存 API Key（方便下次打开）
const savedKey = localStorage.getItem('ds_ppt_key');
if (savedKey) $('apiKey').value = savedKey;
$('apiKey').addEventListener('change', e => {
  localStorage.setItem('ds_ppt_key', e.target.value.trim());
});
</script>
</body>
</html>
